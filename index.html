<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container header">
        <h2 class="logo">Pulse</h2>
        <button class="view-tasks">View tasks</button>
      </div>
    </header>
    <main>
      <div class="container hero">
        <div class="left">
          <h1 class="hero-header">
            Successful starts with organized. Begin today, arrive where you want
            tomorrow.
          </h1>
        </div>
        <div class="right">
          <h3>Add a task:</h3>
          <form class="form" id="form">
            <div class="form-group">
              <label for="title">Title:</label>
              <input type="text" id="title" name="title" />
            </div>
            <div class="form-group">
              <label for="category">Category:</label>
              <input type="text" id="category" name="category" />
            </div>
            <div class="form-group">
              <label for="priority">Priority:</label>
              <select id="priority" name="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group">
              <label for="duration">Duration:</label>
              <input type="number" id="duration" name="duration" />
            </div>
            <button type="submit" class="submit">Submit</button>
          </form>
        </div>
      </div>
    </main>

    <h2 class="tasks-header">Ongoing tasks</h2>
    <div class="task-container"></div>
    <h2 class="tasks-header">Completed tasks</h2>
    <div class="completed-container"></div>
    <script src="script.js"></script>
  </body>
</html>
